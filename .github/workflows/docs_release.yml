---
name: Deploy VitePress to gh-pages

on:
  push:
    branches:
      - master
    paths:
      - "documentation/**"
      - ".github/workflows/docs_release.yml"
  pull_request:
    branches:
      - master
    paths:
      - "documentation/**"
      - ".github/workflows/docs_release.yml"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: "./documentation/package-lock.json"

      - name: Install dependencies and build documentation
        run: |
          cd documentation
          npm ci
          npm run docs:build

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: documentation/.vitepress/dist
          clean: true
          clean-exclude: |
            index.yaml
            artifacthub-repo.yml
            pubkey.gpg
